name: Releaser

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  npm:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Pantry
        uses: home-lang/pantry/packages/action@main

      - name: Install Dependencies
        run: bun install

      - name: Publish
        run: pantry publish --npm --access public
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      # The release has advertised these five zips since the workflow was
      # written, but nothing produced them: action-releaser skips missing files
      # without complaint, so every release shipped an empty downloads section
      # and no job ever failed. Runs AFTER publish, and continue-on-error, so a
      # cross-compilation problem surfaces as a warning instead of blocking the
      # npm release or swallowing itself.
      - name: Compile standalone binaries
        continue-on-error: true
        run: bun run build:binaries

      - name: Create GitHub Release
        uses: stacksjs/action-releaser@v1.2.9
        with:
          files: |
            ./packages/tlsx/bin/tlsx-linux-x64.zip
            ./packages/tlsx/bin/tlsx-linux-arm64.zip
            ./packages/tlsx/bin/tlsx-windows-x64.zip
            ./packages/tlsx/bin/tlsx-darwin-x64.zip
            ./packages/tlsx/bin/tlsx-darwin-arm64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
